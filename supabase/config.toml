# Edge Function settings for `supabase functions deploy`.
# These functions check their own tokens (company code, cron secret or report token),
# so the gateway's JWT check is off for them.
[functions.crew-list]
verify_jwt = false

[functions.pin-login]
verify_jwt = false

[functions.digest]
verify_jwt = false

[functions.report-export]
verify_jwt = false

# The rest receive a Supabase Auth session token and check it in code against the
# project's public signing keys (_shared/auth.ts), including the crew claims.
[functions.sync]
verify_jwt = false
[functions.photo-upload]
verify_jwt = false
[functions.photo-url]
verify_jwt = false
[functions.geocode]
verify_jwt = false
