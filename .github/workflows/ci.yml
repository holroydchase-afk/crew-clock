name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # F-15: fail on any key, token or password anywhere in the history, not just this change.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks, whole history)
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.28.0 git --redact --no-banner --exit-code 1 .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Unit tests
        run: npm test
      - name: Agent roster matches CLAUDE.md
        run: bash scripts/check-agents.sh
      - name: Shared modules in sync
        run: ./scripts/sync-shared.sh && git diff --exit-code

      - name: Database schema and row-level security
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c 'create database crewclock_test'
          psql -h localhost -U postgres -d crewclock_test -v ON_ERROR_STOP=1 -q \
            -f tests/sql/supabase_stub.sql -f supabase/migrations/20261022000000_init.sql -f supabase/migrations/20261023000000_auth_hook.sql -f supabase/migrations/20261023100000_location_consents.sql -f supabase/migrations/20261024000000_retention.sql -f supabase/migrations/20261028000000_harden.sql -f supabase/migrations/20261029000000_crew_auth.sql -f tests/sql/rls_test.sql -f tests/sql/auth_test.sql -f tests/sql/consent_test.sql -f tests/sql/retention_test.sql -f tests/sql/harden_test.sql -f tests/sql/m19_test.sql

      - name: Edge Functions (logic + type check)
        run: |
          deno test --config supabase/functions/deno.json --no-npm tests/edge/
          cd supabase/functions && deno check --config deno.json */index.ts

      - name: MLS messenger
        run: cd messenger && npm ci && npm test && npm run build && git diff --exit-code ../js/vendor/crew-mls.js

      - name: Browser tests
        run: |
          npm install --no-save playwright@1.56.1 http-server@14.1.1 axe-core@4.11.3
          npx playwright install --with-deps chromium
          # Test the site exactly as Cloudflare Pages publishes it
          node scripts/build-site.mjs
          npx http-server dist -p 8123 -c-1 -s &
          # Wait for the server rather than a fixed sleep
          for i in $(seq 1 30); do curl -sf http://localhost:8123/ >/dev/null && break; sleep 1; done
          npm run test:e2e
