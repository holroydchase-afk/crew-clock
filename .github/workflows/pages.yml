name: Deploy demo
# The public demo at chaseholroyd.com/crew-clock/. It deploys only after CI passes on main,
# and it is always built in demo mode (sample data in the visitor's browser, no backend),
# so a recruiter can never reach the real crew's data. The crew's own app is a separate
# build on its own host: docs/SETUP.md step 5.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Deploy the commit CI tested, not whatever main is by now
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the demo
        run: node scripts/build-site.mjs dist --demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
