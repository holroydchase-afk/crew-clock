name: agents-check
# Studio rule (templates/CLAUDE-agents.md): the agent table matches .claude/agents/, every PR body has
# an "Agents:" line, and a PR that changes more than docs names qa-tdd on it (or "qa-tdd skipped: why").
# Each agent the line names must be in .claude/agent-runs/<branch>.log (written by the Agent-tool hook).
# Bot PRs (Dependabot) and titles with [skip agents] are exempt.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  agents:
    if: ${{ github.event.pull_request.user.type != 'Bot' && !contains(github.event.pull_request.title, '[skip agents]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Agent roster matches CLAUDE.md
        run: if [ -f scripts/check-agents.sh ]; then bash scripts/check-agents.sh; else echo "no scripts/check-agents.sh (install it with studio-agents scripts/install-rules.sh)"; fi
      - name: Agents line in the PR body
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          line=$(printf '%s\n' "$BODY" | tr -d '\r' | grep -iE '^[[:space:]>*_-]*agents:' | tail -n 1)
          if [ -z "$line" ]; then
            echo "::error::Add an 'Agents:' line to the PR body naming who ran and the verdict, e.g. 'Agents: staff-pm scoped M1.2; qa-tdd red then green, 3x; ux-reviewer no P0/P1'. See the Studio agents section of CLAUDE.md."
            exit 1
          fi
          code=$(git diff --no-renames --name-only "$BASE...$HEAD" | grep -vE '(\.md$|^docs/|^LICENSE)' || true)
          if [ -n "$code" ] && ! printf '%s' "$line" | grep -qi 'qa-tdd'; then
            echo "::error::This PR changes code or config, so the Agents: line must name qa-tdd (failing test first, all suites 3x) or say 'qa-tdd skipped: <reason>'. Changed: $(echo $code | head -c 300)"
            exit 1
          fi
          # qa-tdd runs as the failing-tests step on every code PR; "skipped" is only for a diff that really is docs-only or config-only.
          # Every "qa-tdd skipped" clause must be exactly "qa-tdd skipped: docs only" or "config only" (nothing around it),
          # and it must be true: this PR already has non-doc files here, so "docs only" is never true, and
          # "config only" is true only when every non-doc file is config data (json, yaml, toml, log files).
          real=$(printf '%s\n' "$code" | grep -vE '\.(json|ya?ml|toml|log)$' || true)
          bad=$(printf '%s' "$line" | grep -oiE 'qa-tdd skipped[^;.]*' | grep -viE '^qa-tdd skipped: *config only *$' || true)
          if [ -n "$code" ] && [ -n "$real" ] && printf '%s' "$line" | grep -qi 'qa-tdd skipped'; then bad="config only needs a config-only diff"; fi
          if [ -n "$code" ] && [ -n "$bad" ]; then
            echo "::error::qa-tdd cannot be skipped on this PR: its diff is not docs-only (or not config-only). Run it (in a cloud thread: bash scripts/agent-prompt.sh qa-tdd \"<task>\" as general-purpose, which logs itself). Skip only with 'qa-tdd skipped: docs only' when every changed file is docs, or 'qa-tdd skipped: config only' when every non-doc file is config. Non-doc files: $(echo $code | head -c 300)"
            exit 1
          fi
          echo "ok: $line"
      # Python is on the runner; Node is set up for repos whose verify command is npm-based.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Agents line matches the run log (and qa-tdd's suites rerun on CI)
        env:
          BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          f=scripts/check-agent-runs.sh; [ -f "$f" ] || f=templates/scripts/check-agent-runs.sh
          if [ -f "$f" ]; then bash "$f"; else echo "no scripts/check-agent-runs.sh (install it with studio-agents scripts/install-rules.sh)"; fi
